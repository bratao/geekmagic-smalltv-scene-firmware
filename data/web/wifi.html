<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wi-Fi management</title>
  <link rel="stylesheet" href="./css/pico.min.css" />
  <link rel="stylesheet" href="./css/style.css" />
  <script src="./js/alpinejs.min.js" defer></script>
  <script src="./js/utils.js"></script>
  <script src="./js/themeSwitcher.js"></script>
  <script src="./js/wifiHandler.js"></script>
  <script src="./js/main.js"></script>
</head>
<body>
<main class="container">
  <header id="header-placeholder"></header>
  <a href="./index.html">← Back to Home</a>
  <section x-data="wifiHandler()">
    <h2>Wi-Fi networks</h2>
    <p>Save up to three networks in priority order. Saving does not change the current connection.</p>
    <p><a href="./token.html">Token settings</a> — authorization loads automatically from this TV.</p>
    <p role="status" aria-live="polite" x-text="statusMsg"></p>
    <p x-show="authRequired"><a href="./token.html">Manage the TV token</a></p>
    <form @submit.prevent="save()">
      <template x-for="(profile, index) in profiles" :key="index">
        <fieldset :disabled="saving || connecting">
          <legend x-text="'Priority ' + (index + 1)"></legend>
          <label>Network name (SSID)<input x-model="profile.ssid" maxlength="32" autocomplete="off" required /></label>
          <label x-show="profile.originalSsid === profile.ssid">
            <input type="checkbox" x-model="profile.replacePassword" /> Replace saved password
          </label>
          <label x-show="profile.replacePassword || profile.originalSsid !== profile.ssid">
            Password (empty for an open network)
            <input type="password" x-model="profile.password" maxlength="64" autocomplete="new-password" />
          </label>
          <small x-show="!profile.replacePassword && profile.originalSsid === profile.ssid">Saved credentials are preserved and never displayed.</small>
          <div>
            <button type="button" @click="moveProfile(index, -1)" :disabled="index === 0">Move up</button>
            <button type="button" @click="moveProfile(index, 1)" :disabled="index === profiles.length - 1">Move down</button>
            <button type="button" @click="profiles.splice(index, 1)">Remove</button>
            <button type="button" @click="connectSaved(profile)" :disabled="scanning || profile.originalSsid !== profile.ssid || profile.replacePassword">Connect saved network</button>
          </div>
        </fieldset>
      </template>
      <button type="button" @click="addProfile()" :disabled="profiles.length >= 3 || saving || connecting">Add network</button>
      <button type="submit" :disabled="saving || connecting || scanning" :aria-busy="saving">Save networks</button>
    </form>
    <hr />
    <button @click="scan()" :disabled="scanning || saving || connecting" :aria-busy="scanning">Scan networks</button>
    <button x-show="scanning" @click="cancelScan(); statusMsg = 'Scan cancelled. You can retry.'">Cancel scan</button>
    <table>
      <thead><tr><th>Network</th><th>Signal</th><th></th></tr></thead>
      <tbody>
        <template x-for="(net, index) in networks" :key="index">
          <tr><td x-text="net.ssid"></td><td x-text="net.rssi + ' dBm'"></td>
            <td><button @click="selectNetwork(net)" :disabled="profiles.length >= 3 || saving || connecting">Add</button></td></tr>
        </template>
      </tbody>
    </table>
  </section>
  <footer id="footer-placeholder"></footer>
</main>
</body>
</html>
